name: Plugin validation
on:
  workflow_dispatch:
jobs:
  pluginval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Download pluginval
        run: |
          curl -L -o pluginval.tar.gz https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.tar.gz
          tar -xzf pluginval.tar.gz
      - name: Validate
        run: |
          PLUGIN=$(find build -name '*.vst3' -type d | head -n 1)
          ./pluginval --strictness-level 5 --validate "$PLUGIN"

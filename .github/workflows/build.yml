name: Build SWA Tronix 2A

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        run: |
          mkdir -p artifacts
          find build -type d \( -name '*.vst3' -o -name '*_artefacts' \) -print
          tar -czf artifacts/SWA-Tronix-2A-linux.tar.gz -C build .
      - uses: actions/upload-artifact@v4
        with:
          name: SWA-Tronix-2A-linux
          path: artifacts/*

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64\;x86_64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build artifacts/SWA-Tronix-2A-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SWA-Tronix-2A-macos
          path: artifacts/*

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path build/* -DestinationPath artifacts/SWA-Tronix-2A-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SWA-Tronix-2A-windows
          path: artifacts/*
